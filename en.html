<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lessons One and Two: General Questions, with 3D scenes">
<meta property="og:description" content="Lessons One and Two: General Questions, with 3D scenes">
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>The Superiority of Man</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Reem+Kufi:wght@500;700&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: a night-sky lesson. One stage: the book's words on the reading side, a glowing 3D or motion scene for the lit sentence on the other.
   Single deliberate dark look in the channel's style (deep indigo night, ember orange, gold). */
:root{
  --night:#0C0A1C; --leaf:#14112B; --ink:#F4ECDD; --muted:#A59CC4; --line:#2E2852;
  --gold:#F4B740; --ember:#FF8B3D; --sea:#2B2350; --danger:#FF8A80;
  --bg3:#0E0B22;
  /* names kept for the drawn scenes */
  --lapis:var(--ember); --paper:#16132E; --soft:#0C0A1C; --bg:var(--night); --mark:rgba(244,183,64,.13);
  --f-ui:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-read:"EB Garamond",Georgia,"Times New Roman",serif;
  --f-display:"Reem Kufi","Vazirmatn",Tahoma,sans-serif;
  --f-quran:"Amiri","Traditional Arabic","Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.9;
  background-image:radial-gradient(80% 50% at 50% 0%,rgba(255,139,61,.07),transparent 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,36px);margin:0;line-height:1.3;color:var(--gold);
  text-shadow:0 0 18px rgba(244,183,64,.35)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-width:0}
.lessons{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(20,17,43,.6)}
.lsn{background:transparent;border:0;border-radius:999px;padding:5px 16px;color:var(--muted);cursor:pointer;font:600 14px/1.6 var(--f-ui)}
.lsn:hover{color:var(--gold)}
.lsn[aria-current="page"]{background:var(--gold);color:var(--night);box-shadow:0 0 14px rgba(244,183,64,.45)}
.lsn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,select{font:inherit;color:inherit}
.btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;line-height:1.6;color:var(--ink)}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn[aria-pressed="true"]{background:var(--gold);color:var(--night);border-color:var(--gold)}
.btn:focus-visible,.nav:focus-visible,.dot:focus-visible,.seg:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.stage{position:relative;background:var(--leaf);border:1px solid var(--line);border-radius:22px;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);height:min(74vh,620px);overflow:hidden;
  box-shadow:0 0 0 1px rgba(244,183,64,.06),0 30px 80px -30px rgba(255,139,61,.25)}
.text{padding:clamp(18px,3vw,44px);display:flex;flex-direction:column;justify-content:safe center;gap:14px;min-width:0;overflow-y:auto}
.scene{position:relative;isolation:isolate;min-width:0;overflow:hidden;border-inline-start:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 45%,#1C1638 0%,#0C0A1C 72%)}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sceneIn{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;min-width:0;padding:18px}
.scene svg{width:100%;max-width:480px;height:auto;max-height:440px;font-family:var(--f-ui);filter:drop-shadow(0 0 5px rgba(255,150,60,.38))}
.scene .fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:scale(.97)}to{opacity:1;transform:none}}
/* slide-show sizing: a 16:9 slide that fits the window, like a PowerPoint show */
@media (min-width:781px){ .stage{height:auto;aspect-ratio:16/9;width:min(100%,calc((100svh - 150px)*16/9));margin-inline:auto;min-height:420px} }
.stage:fullscreen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;border-radius:0;border:0;margin:0}
.stage:fullscreen .text{padding:clamp(28px,4vw,80px)}
@media (max-width:780px){
  .stage{grid-template-columns:1fr;height:auto}
  .scene{order:-1;border-inline-start:0;border-bottom:1px solid var(--line)}
  .sceneIn{min-height:300px}
  .scene svg{max-height:260px}
}

/* 3D scenes fill the whole scene panel */
.g3d{position:absolute;inset:0;touch-action:pan-y}
.g3d canvas{width:100%!important;height:100%!important;display:block}
.g3d::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 80% at 50% 50%,transparent 55%,rgba(5,4,14,.55))}
.lbl{position:absolute;transform:translate(-50%,-50%);color:var(--ink);font:600 15px/1.4 var(--f-ui);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 10px rgba(255,139,61,.7),0 0 2px rgba(0,0,0,.9);z-index:2}
.lbl.big{font:700 clamp(40px,6vw,64px)/1 var(--f-display);color:var(--gold)}
.lbl.gold{color:var(--gold)}

/* reading side */
.blk{margin:0}
.blk.ar{font-family:var(--f-quran);font-size:clamp(22px,2.6vw,31px);line-height:2.15;text-align:center;color:var(--gold)}
.blk.h{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.6vw,42px);line-height:1.5;color:var(--gold)}
.blk.hdr{font-family:var(--f-ui);font-size:15px;font-weight:800;color:var(--ember)}
.blk.p{font-family:var(--f-read);font-size:clamp(18px,1.65vw,21px);line-height:1.75;hyphens:auto;text-align:justify;max-width:66ch}
.blk.q{font-family:var(--f-read);font-size:clamp(20px,2.05vw,25px);line-height:1.6;font-weight:600;max-width:58ch}
.seg{border-radius:6px;padding:2px 3px;transition:color .35s,background-color .35s,text-shadow .35s;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.text.stepping .seg{color:rgba(244,236,221,.42)}
.text.stepping .blk.ar .seg,.text.stepping .blk.h .seg{color:rgba(244,183,64,.45)}
.text.stepping .seg.on{color:var(--ink);background:var(--mark);box-shadow:inset 0 -2px 0 rgba(244,183,64,.7);text-shadow:0 0 14px rgba(244,183,64,.25)}
.text.stepping .blk.ar .seg.on,.text.stepping .blk.h .seg.on{color:var(--gold)}
.edit .seg{outline:1px dashed var(--line);cursor:text}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:20px;display:grid;place-items:center}
.nav:hover{border-color:var(--gold);color:var(--gold)}
.dots{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;flex:1;min-width:0}
.dot{width:10px;height:10px;border:0;background:var(--line);cursor:pointer;padding:0;transform:rotate(45deg);border-radius:2px}
.dot[aria-current="true"]{background:var(--gold);box-shadow:0 0 10px var(--gold);transform:rotate(45deg) scale(1.3)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-width:64px;text-align:center}
.notes{background:var(--leaf);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.notes b{color:var(--gold);font-size:14px}
.notes div{margin-top:4px;max-width:80ch;min-height:1.8em}
.notes div:empty::before{content:attr(data-ph);color:var(--muted)}
.notes.edit div{outline:1px dashed var(--line)}
.editbar{background:var(--leaf);border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.editbar[hidden],.notes[hidden],.detail[hidden]{display:none}
.editbar label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.editbar select{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.hint{font-size:13px;color:var(--muted)}

/* timeline points + detail page */
.scene .ev{cursor:pointer;outline:none}
.scene .ev:hover circle+circle,.scene .ev:focus-visible circle+circle{stroke:var(--ink);stroke-width:4}
.fadein{animation:fi 1.2s ease both;animation-delay:var(--d,0s)} @keyframes fi{from{opacity:0}}
.detail{position:absolute;inset:0;z-index:5;background:var(--leaf);overflow-y:auto;padding:clamp(18px,3vw,44px);display:flex;flex-direction:column;gap:12px;animation:fade .35s ease both}
.detail #backBtn{align-self:flex-start}
.dmeta{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kind{border-radius:999px;padding:1px 12px;font-size:13px;font-weight:700;color:var(--night);background:var(--gold)}
.kind[data-k="down"]{background:var(--ember)} .kind[data-k="ex"]{background:var(--ink)}
.kind[data-k="mind"]{background:transparent;color:var(--ember);border:1.5px dashed var(--ember)}
.dyear{color:var(--muted);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
#dTitle{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,3.4vw,40px);margin:0;line-height:1.4;color:var(--gold);text-wrap:balance}
#dBody p{margin:0 0 10px;max-width:66ch;font-family:var(--f-read);font-size:clamp(18px,1.6vw,20px);line-height:1.7}
.vlink{align-self:flex-start;color:var(--ember);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}

/* drawn (2D) scenes */
.k{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.g{stroke:var(--gold);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.l{stroke:var(--lapis);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.m{stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg{fill:var(--gold)} .fl{fill:var(--lapis)} .fk{fill:var(--ink)} .fp{fill:var(--paper)} .fs{fill:var(--sea)} .fn{fill:var(--line)} .fm{fill:var(--muted)}
.t{fill:var(--ink);font-size:16px;font-weight:600}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:.001;transform:scale(.3)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes grow{from{transform:scaleY(.02)}to{transform:none}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin var(--sp,30s) linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin var(--sp,6s) linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{transform:translateY(-7px) rotate(-2deg)}}
.waves{animation:waves 5s linear infinite} @keyframes waves{to{transform:translateX(-80px)}}
.beam{transform-box:view-box;transform-origin:200px 110px;animation:tilt 1.6s cubic-bezier(.4,1.6,.5,1) .5s both}
@keyframes tilt{to{transform:rotate(-10deg)}}
.panL{animation:down 1.6s cubic-bezier(.4,1.6,.5,1) .5s both} @keyframes down{to{transform:translateY(19px)}}
.panR{animation:up 1.6s cubic-bezier(.4,1.6,.5,1) .5s both} @keyframes up{to{transform:translateY(-19px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.3);opacity:.5}}
.flip{transform-box:fill-box;transform-origin:var(--o,center);animation:flip 3s ease-in-out infinite}
@keyframes flip{50%{transform:scaleX(.15)}}
.hit{animation:hit 2.2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes hit{0%,100%{transform:translateX(-70px);opacity:.3}50%{transform:none;opacity:1}}
.drift{transform-box:fill-box;animation:drift 2.6s ease-in both;animation-delay:var(--d,0s)}
@keyframes drift{to{transform:translate(var(--dx),var(--dy));opacity:.35}}
.wallL{animation:wallL 3s ease-in-out infinite alternate} @keyframes wallL{to{transform:translateX(70px)}}
.wallR{animation:wallR 3s ease-in-out infinite alternate} @keyframes wallR{to{transform:translateX(-70px)}}
.fall{animation:fall 1.2s linear infinite;animation-delay:var(--d,0s)} @keyframes fall{from{transform:translateY(-30px);opacity:0}30%{opacity:1}to{transform:translateY(30px);opacity:0}}
.away{animation:away 3.2s ease-in infinite} @keyframes away{0%,15%{transform:none;opacity:1}100%{transform:translateX(-150px);opacity:0}}
.road{stroke-dasharray:14 16;animation:road 1s linear infinite} @keyframes road{to{stroke-dashoffset:-30}}
.up{animation:upk 2.4s ease-in-out infinite alternate} @keyframes upk{to{transform:translateY(-40px)}}
.into{animation:into 1.6s ease-in infinite;animation-delay:var(--d,0s)} @keyframes into{from{transform:translate(var(--dx),-70px);opacity:0}25%{opacity:1}to{transform:none;opacity:0}}
.fadeout{animation:fo 2.4s ease forwards .8s} @keyframes fo{to{opacity:0}}
.lift{animation:lift 1.6s cubic-bezier(.2,.8,.2,1) both .3s} @keyframes lift{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){
  .pop,.grow,.spin,.spinr,.bob,.waves,.pulse,.flip,.hit,.wallL,.wallR,.fall,.away,.road,.up,.into,.lift,.scene .fade,.fadein,.detail{animation:none}
  .draw{animation:none;stroke-dashoffset:0}
  .beam{animation:none;transform:rotate(-10deg)} .panL{animation:none;transform:translateY(19px)} .panR{animation:none;transform:translateY(-19px)}
  .drift{animation:none;transform:translate(var(--dx),var(--dy))} .fadeout{animation:none;opacity:0}
}
</style>

</head>
<body>
<div class="wrap" dir="ltr" lang="en">
  <header>
    <div class="brand"><h1 id="lessonTitle">The Superiority of Man</h1><nav class="lessons" aria-label="Lessons"><button class="lsn" data-l="0" aria-current="page">Lesson One</button><button class="lsn" data-l="1">Lesson Two</button></nav></div>
    <div class="tools">
      <button class="btn" id="playBtn" aria-pressed="false">▶ Autoplay</button>
      <button class="btn" id="notesBtn" aria-pressed="false">Teacher notes</button>
      <button class="btn" id="editBtn" aria-pressed="false">Edit</button>
      <button class="btn" id="fsBtn">Full screen</button>
    </div>
  </header>

  <main class="stage" id="stage"><div class="text stepping" id="text"></div><div class="scene" id="sceneWrap"><canvas id="amb" aria-hidden="true"></canvas><div class="sceneIn" id="scene"></div></div>
    <div class="detail" id="detail" hidden role="dialog" aria-labelledby="dTitle">
      <button class="btn" id="backBtn">← Back</button>
      <div class="dmeta"><span class="kind" id="dKind"></span><span class="dyear" id="dYear"></span></div>
      <h3 id="dTitle"></h3>
      <div id="dBody"></div>
      <a class="vlink" id="dVid" target="_blank" rel="noopener" href="https://www.youtube.com">Related videos ↗</a>
    </div>
  </main>

  <div class="editbar" id="editbar" hidden>
    <label for="scenePick">Scene for the selected sentence <select id="scenePick"></select></label>
    <button class="btn" id="addSeg">+ Sentence</button>
    <button class="btn warn" id="delSeg">Delete sentence</button>
    <button class="btn" id="addBtn">+ Slide</button>
    <button class="btn warn" id="delBtn">Delete slide</button>
    <button class="btn" id="resetBtn">Restore the original text</button>
    <span class="hint">Tap any sentence to type. Changes are saved in this browser only.</span>
  </div>

  <div class="bar">
    <button class="nav" id="prev" aria-label="Previous">←</button>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
    <button class="nav" id="next" aria-label="Next">→</button>
  </div>

  <section class="notes" id="notes" hidden><b>Teacher notes</b><div id="noteBox" data-ph="Write your notes for this slide…"></div></section>
</div>

<script>

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S=(k,t,s,np)=>({k,t,s,np:!!np});

/* Text is copied word for word from the book pages. */
const LESSON1=[
 {segs:[S("ar","أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيم","shield"),S("ar","بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم","rosette",1)]},
 {segs:[S("ar","﴿الْحَمْدُ لِلَّهِ الَّذِي هَدَانَا لِهَـٰذَا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلاَ أَنْ هَدَانَا اللَّهُ﴾","verse")]},
 {segs:[S("p","Translation: Praise and glory be to God, who guided us,","praise"),
        S("p","and had He, exalted be His majesty, not shown us the way, we would never have found the way.","lost"),
        S("p","In other words, had He, glorified be His majesty, not guided us to the straight highway, we would not have been rightly guided.","highway")]},
 {segs:[S("h","Introduction","book"),
        S("p","One of the storms of the mind and the burning questions of the day, in the eyes of perceptive, God-seeking and enlightened young people, is this:","brainstorm"),
        S("p","to understand, as soon as possible, the true root cause of the rapid progress of early Islam,","rise"),
        S("p","and, alongside it, they also long to know what factors brought about the backwardness and the scattering of this great body of believers,","scatter"),
        S("p","which is, of course, a good thought.","bulb")]},
 {segs:[S("p","Whenever we answer questions on matters such as these the way some officials do, by referring people to the reading of the Qur'an, or of commentaries and other long and wide Islamic works,","bookstack"),
        S("p","it is as if, in the popular saying, we had sent these pure-hearted seekers off “behind the black pea”,","pea"),
        S("p","which would in itself be deceiving them, or sending them wandering down a side alley;","alley")]},
 {segs:[S("p","and let no one mistake this to mean that young people will not reach, through the study of commentaries and hadiths, the solution of their own problems and questions and the very depth of healing for their inner pains;","heal"),
        S("p","rather, the truth is that the endless sights and spectacles of the present age, this and that amusement, mostly vain and wasters of life, have made time and opportunity so narrow, and ever narrower,","squeeze"),
        S("p","that they have taken from most of them the chance to read a commentary, and even a simple recitation.","bookaway")]},
 {segs:[S("p","So, seeing this reality, does referring them to read commentaries and translated hadiths not amount to giving no answer, or to sending them down a side alley?","question"),
        S("p","The answer is yes.","check")]},
 {segs:[S("p","Understanding these facts, we have now, through simple questions in 6 chapters,","six"),
        S("p","drawn out the very essence of the foundations of the rise of Islam and of humanity, while showing the cause of its backwardness,","kernel"),
        S("p","summarized it in 49 valuable and instructive questions,","grid49"),
        S("p","and offered it to our brothers and to the devoted lovers of Islam and humanity.","offer")]},
 {segs:[S("hdr","Lesson One: General Questions","title"),S("h","The Superiority of Man","title",1)]},
 {segs:[S("q","1) Has humankind's mastery over sea and land, over all other creatures,","landsea"),S("q","come about because of the brain?","brainq")]},
 {segs:[S("q","2) If attaining this blessing (mastery over things) depends on the brain,","brainreach"),
        S("q","is the elephant, with a brain of one ser¹, not more deserving than man to discover the secrets of things?","scale")]},
 {segs:[S("q","3) Why did man, with a small brain of about one kilo, succeed in astonishing inventions of tools and giant machines,","invent"),
        S("q","while larger creatures such as the elephant did not?","elephant")]},
 {segs:[S("q","4) Why has man given himself the right, whatever he finds,","grab"),S("q","to make both lawful and unlawful use of it?","trust")]},
 {segs:[S("q","5) Why was the human body created upright, unlike all other creatures,","upright"),S("q","and the other creatures horizontal?","animal")]},

/* ambient layer: dust, ring pieces and a ripple on every new sentence */
let ambRip=[];
const ambC=document.getElementById("amb"), ambX=ambC.getContext("2d"), ambStatic=matchMedia("(prefers-reduced-motion: reduce)").matches;
let ambW=0, ambH=0; const ambP=[];
for(let k=0;k<70;k++) ambP.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.6,v:.004+Math.random()*.012,a:.25+Math.random()*.5,ph:Math.random()*6.28});
function ambRipple(){ ambRip.push(performance.now()); if(ambRip.length>3) ambRip.shift(); if(ambStatic) ambDraw(performance.now()); }
function ambFit(){ const r=ambC.getBoundingClientRect(), d=Math.min(devicePixelRatio||1,2); ambW=r.width; ambH=r.height; ambC.width=Math.max(1,ambW*d); ambC.height=Math.max(1,ambH*d); ambX.setTransform(d,0,0,d,0,0); if(ambStatic) ambDraw(performance.now()); }
function ambDraw(now){
  const t=now/1000, X=ambX, cx=ambW/2, cy=ambH/2, R=Math.min(ambW,ambH); if(!R) return;
  X.clearRect(0,0,ambW,ambH);
  const g=X.createRadialGradient(cx,cy,0,cx,cy,R*.55); g.addColorStop(0,"rgba(255,140,60,.10)"); g.addColorStop(1,"rgba(255,140,60,0)"); X.fillStyle=g; X.fillRect(0,0,ambW,ambH);
  let boost=0; ambRip.forEach(s=>{ const e=(now-s)/1000; if(e>=0&&e<1.4) boost=Math.max(boost,1-e/1.4); });
  [[.45,12,.05,1],[.34,8,-.08,.8]].forEach(([rf,n,sp,al],ri)=>{ const rad=R*rf, rot=t*sp+(ri?-1:1)*boost*boost*.7; X.lineWidth=2; X.lineCap="round";
    for(let k=0;k<n;k++){ const a0=rot+k*2*Math.PI/n, a1=a0+2*Math.PI/n*.62; X.strokeStyle=`rgba(${k%3?"255,150,70":"244,183,64"},${(.07+.12*boost)*al})`; X.beginPath(); X.arc(cx,cy,rad,a0,a1); X.stroke(); } });
  ambRip.forEach(s=>{ const e=(now-s)/1000; if(e<0||e>1.6) return; const p=e/1.6; X.strokeStyle=`rgba(255,160,80,${.35*(1-p)})`; X.lineWidth=2*(1-p)+.5; X.beginPath(); X.arc(cx,cy,R*(.05+.6*(1-Math.pow(1-p,3))),0,6.283); X.stroke(); });
  ambP.forEach(p=>{ if(!ambStatic){ p.y-=p.v*.016; if(p.y<-.02){ p.y=1.02; p.x=Math.random(); } } const tw=.6+.4*Math.sin(t*1.5+p.ph); X.fillStyle=`rgba(255,200,120,${(p.a*tw).toFixed(3)})`; X.beginPath(); X.arc(p.x*ambW,p.y*ambH,p.r,0,6.283); X.fill(); });
}
try{ new ResizeObserver(ambFit).observe(ambC); }catch(e){}
if(!ambStatic){ const L=n=>{ ambDraw(n); requestAnimationFrame(L); }; requestAnimationFrame(L); }

const svgFor=key=>`<svg viewBox="0 0 400 300" role="img" aria-label="${esc(NAMES[key])}"><g class="fade">${(SC[key]||SC.plain)()}</g></svg>`;

function webglOK(){ if(_gl!==null) return _gl; try{ const c=document.createElement("canvas"); _gl=!!(c.getContext("webgl")||c.getContext("experimental-webgl")); }catch(e){ _gl=false; } return _gl; }
function stop3D(){ if(r3){ try{ r3.stop(); }catch(e){} r3=null; } cur3D=null; }

const G3D=(()=>{
/* ---------- shared 3D stage: night, stars, dust, bloom glow, HTML labels ---------- */
function stage(el,o={}){
  const T=THREE, cs=getComputedStyle(el), col=n=>new T.Color((cs.getPropertyValue(n)||"#888").trim());
  const C={gold:col("--gold"),ember:col("--ember"),ink:col("--ink"),mut:col("--muted"),bg:col("--bg3"),sea:new T.Color("#3c5fd0")};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ren=new T.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
  const pr=Math.min(devicePixelRatio||1,1.75); ren.setPixelRatio(pr); ren.setClearColor(C.bg,1);
  el.appendChild(ren.domElement);
  const sc=new T.Scene(); sc.fog=new T.Fog(C.bg,o.fogNear||16,o.fogFar||40);
  const cam=new T.PerspectiveCamera(o.fov||38,4/3,.1,200);
  sc.add(new T.HemisphereLight(0xfff1dc,0x2a1f4a,.6));
  const sun=new T.DirectionalLight(0xffffff,.75); sun.position.set(4,9,7); sc.add(sun);
  let comp=null,bloom=null;
  if(T.EffectComposer&&T.UnrealBloomPass&&T.RenderPass){
    comp=new T.EffectComposer(ren); comp.setPixelRatio(pr); comp.addPass(new T.RenderPass(sc,cam));
    bloom=new T.UnrealBloomPass(new T.Vector2(256,256),o.bloom??.68,.5,.42); comp.addPass(bloom);
  }
  const std=(c,m,r,ei)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r,emissive:c,emissiveIntensity:ei});
  const M={gold:std(C.gold,.8,.28,.2),ember:std(C.ember,.3,.45,.3),ink:std(C.ink,.1,.55,.1),mut:std(C.mut,.2,.6,.05),
    sea:std(C.sea,.2,.35,.18),dark:std(new T.Color("#2a2446"),.2,.7,.05),
    glow:(c,a=1)=>new T.MeshBasicMaterial({color:c,transparent:true,opacity:a,depthWrite:false,blending:T.AdditiveBlending}),
    line:(c,a=1)=>new T.LineBasicMaterial({color:c,transparent:true,opacity:a})};
  /* sky: far stars + rising dust */
  const mkPts=(n,f,size,color,op)=>{const p=new Float32Array(n*3); for(let k=0;k<n;k++){const v=f(k); p[k*3]=v[0];p[k*3+1]=v[1];p[k*3+2]=v[2];}
    const g=new T.BufferGeometry(); g.setAttribute("position",new T.BufferAttribute(p,3));
    const m=new T.Points(g,new T.PointsMaterial({color,size,transparent:true,opacity:op,depthWrite:false,blending:T.AdditiveBlending})); sc.add(m); return m;};
  mkPts(700,()=>{const u=Math.random()*2-1,a=Math.random()*6.283,r=24+Math.random()*14,s=Math.sqrt(1-u*u); return [r*s*Math.cos(a),r*u*.7+4,r*s*Math.sin(a)-6];},.09,0xffe2b0,.8);
  const dust=mkPts(o.dust??180,()=>{const a=Math.random()*6.283,r=.5+Math.random()*5.5; return [Math.cos(a)*r,Math.random()*7-.5,Math.sin(a)*r-.5];},.06,C.gold,.9);
  const labels=[], fns=[], v3=new T.Vector3();
  const api={T,sc,cam,C,M,el,reduce,
    on(f){fns.push(f);},
    ease(t,s=0,d=1){const x=Math.min(1,Math.max(0,(t-s)/d)); return 1-Math.pow(1-x,3);},
    label(text,at,cls){const d=document.createElement("div"); d.className="lbl "+(cls||""); d.textContent=text; el.appendChild(d); const L={d,at,op:1}; labels.push(L); return L;},
    human(mat){const g=new T.Group(),cyl=(a,b,h)=>new T.CylinderGeometry(a,b,h,24),m=mat||M.ink;
      const part=(geo,x,y,rz)=>{const p=new T.Mesh(geo,m); p.position.set(x,y,0); p.rotation.z=rz||0; g.add(p); return p;};
      part(new T.SphereGeometry(.27,32,24),0,2.72); part(cyl(.26,.2,1.05),0,1.92);
      const aG=cyl(.075,.07,1.25),an=Math.PI/2-.18; g.userData.armL=part(aG,-.77,2.33,an); g.userData.armR=part(aG,.77,2.33,-an);
      const hG=new T.SphereGeometry(.09,16,12); part(hG,-.77-.98*.64,2.33+.18*.64); part(hG,.77+.98*.64,2.33+.18*.64);
      const lG=cyl(.1,.08,1.3); part(lG,-.2,.66,-.12); part(lG,.2,.66,.12); return g;},
    beast(mat,s=1){const g=new T.Group(),m=mat||M.mut,cyl=(a,b,h)=>new T.CylinderGeometry(a,b,h,12);
      const body=new T.Mesh(new T.SphereGeometry(.45,20,14),m); body.rotation.z=Math.PI/2; body.scale.set(1,1.6,1); body.position.y=.95; g.add(body);
      const head=new T.Mesh(new T.SphereGeometry(.26,20,14),m); head.position.set(.85,1.2,0); g.add(head);
      const legs=[]; [[-.45,.18],[-.45,-.18],[.45,.18],[.45,-.18]].forEach(([x,z],k)=>{const pv=new T.Group(); pv.position.set(x,.85,z); const l=new T.Mesh(cyl(.07,.06,.8),m); l.position.y=-.4; pv.add(l); g.add(pv); legs.push(pv);});
      g.userData.legs=legs; g.scale.setScalar(s); return g;},
    star(r,t,mat){const g=new T.Group(); for(let k=0;k<2;k++){const q=new T.Mesh(new T.TorusGeometry(r,t,8,4),mat); q.rotation.z=k*Math.PI/4; g.add(q);} return g;},
    orb(r,c,halo=2.4){const g=new T.Group(); g.add(new T.Mesh(new T.SphereGeometry(r,32,24),new T.MeshBasicMaterial({color:c})));
      const h=new T.Mesh(new T.SphereGeometry(r*halo,32,24),M.glow(c,.12)); g.add(h); g.userData.halo=h; return g;},
    ringPieces(r,n,tube,mat,fill=.72){const g=new T.Group(),geo=new T.TorusGeometry(r,tube,8,28,2*Math.PI/n*fill);
      for(let k=0;k<n;k++){const p=new T.Mesh(geo,mat); const a=k*2*Math.PI/n; p.rotation.z=a; p.userData={a,home:new T.Vector3(),from:new T.Vector3((Math.random()-.5)*14,(Math.random()-.5)*9,(Math.random()-.5)*8),spin:(Math.random()-.5)*6}; g.add(p);} return g;},
    gear(r,n,depth,mat){const s=new T.Shape(),d=Math.PI/n;
      for(let k=0;k<n;k++){const a=k*2*d,pt=[[a-.62*d,r],[a-.32*d,r+.22],[a+.32*d,r+.22],[a+.62*d,r]];
        pt.forEach(([q,R],i)=>{const x=Math.cos(q)*R,y=Math.sin(q)*R; (k===0&&i===0)?s.moveTo(x,y):s.lineTo(x,y);});}
      s.closePath(); const h=new T.Path(); h.absarc(0,0,r*.35,0,Math.PI*2,true); s.holes.push(h);
      const geo=new T.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelSize:.03,bevelThickness:.03,bevelSegments:1,curveSegments:16}); geo.center(); return new T.Mesh(geo,mat);}
  };
  let px=0,py=0,sx=0,sy=0;
  const onMove=e=>{const r=el.getBoundingClientRect(); px=(e.clientX-r.left)/r.width-.5; py=(e.clientY-r.top)/r.height-.5;};
  el.addEventListener("pointermove",onMove);
  const base=o.cam||[0,3,10.5], look=new T.Vector3(...(o.look||[0,1.6,0])), dist=Math.hypot(base[0],base[2]), a0=Math.atan2(base[0],base[2]), sway=o.sway??.3;
  const fit=()=>{const w=el.clientWidth||400,h=el.clientHeight||300; ren.setSize(w,h,false); if(comp) comp.setSize(w,h); cam.aspect=w/h;
    cam.fov=(o.fov||38)*(w/h<1.1?1.25:1); cam.updateProjectionMatrix(); if(reduce) frame(9,0);};
  function frame(t,dt){
    fns.forEach(f=>f(t,dt));
    const a=dust.geometry.attributes.position.array; for(let k=1;k<a.length;k+=3){ a[k]+=dt*.3; if(a[k]>6.5) a[k]=-.5; } dust.geometry.attributes.position.needsUpdate=true;
    sx+=(px-sx)*.05; sy+=(py-sy)*.05;
    const ca=a0+sway*Math.sin(t*.12)+sx*.55;
    cam.position.set(Math.sin(ca)*dist,base[1]-sy*1.1,Math.cos(ca)*dist); cam.lookAt(look); cam.updateMatrixWorld();
    const w=el.clientWidth,h=el.clientHeight;
    labels.forEach(L=>{ if(L.at.isObject3D) L.at.getWorldPosition(v3); else v3.set(...L.at); v3.project(cam);
      L.d.style.left=((v3.x*.5+.5)*w).toFixed(1)+"px"; L.d.style.top=((-v3.y*.5+.5)*h).toFixed(1)+"px"; L.d.style.opacity=L.op; });
    comp?comp.render():ren.render(sc,cam);
  }
  const ro=new ResizeObserver(fit); ro.observe(el);
  let raf=0,t0=performance.now(),last=t0;
  const loop=now=>{const dt=Math.min(.05,(now-last)/1000); last=now; frame((now-t0)/1000,dt); raf=requestAnimationFrame(loop);};
  api.go=()=>{fit(); if(reduce) frame(9,0); else raf=requestAnimationFrame(loop); return api;};
  api.stop=()=>{cancelAnimationFrame(raf); ro.disconnect(); el.removeEventListener("pointermove",onMove);
    sc.traverse(x=>{ if(x.geometry) x.geometry.dispose(); if(x.material){ [].concat(x.material).forEach(m=>m.dispose()); } });
    if(comp&&comp.renderTarget1){ comp.renderTarget1.dispose(); comp.renderTarget2.dispose(); }
    ren.dispose(); try{ren.forceContextLoss();}catch(e){} ren.domElement.remove(); labels.forEach(L=>L.d.remove());};
  return api;
}

/* the brain: three readings of the same organ */
function brain(el,mode){const A=stage(el,{cam:[0,2.2,10],look:[0,1.8,0],sway:.35}),{T,sc,M,C}=A;
  const geo=new T.SphereGeometry(1.6,128,96), p=geo.attributes.position, v=new T.Vector3();
  for(let k=0;k<p.count;k++){v.fromBufferAttribute(p,k).normalize(); const n=Math.sin(v.x*15+Math.sin(v.y*8+v.z*6)*2.4)*Math.cos(v.y*13+Math.sin(v.z*7+v.x*3)*2);
    const groove=-.16*Math.exp(-Math.pow(v.x/.1,2))*(v.y>-.3?1:0); const r=1.6*(1+.042*n+groove); p.setXYZ(k,v.x*r*1.12,v.y*r*.92,v.z*r*1.3);}
  geo.computeVertexNormals();
  const br=new T.Mesh(geo,new T.MeshStandardMaterial({color:C.ember.clone().multiplyScalar(.75),roughness:.5,metalness:.2,emissive:C.ember,emissiveIntensity:.08})); br.position.y=1.8; sc.add(br);
  const wire=new T.Mesh(geo,new T.MeshBasicMaterial({color:C.gold,wireframe:true,transparent:true,opacity:.05})); br.add(wire);

  const hh=new T.Mesh(new T.BoxGeometry(.07,.7,.04),M.ink); hh.geometry.translate(0,.35,0); hh.position.z=.06; w.add(hh);
  const mh=new T.Mesh(new T.BoxGeometry(.04,1.05,.04),M.ember); mh.geometry.translate(0,.52,0); mh.position.z=.08; w.add(mh);
  const g1=A.gear(.55,12,.12,M.gold), g2=A.gear(.35,9,.12,M.ember); g1.position.set(-.35,-.2,-.25); g2.position.set(.5,.38,-.25); w.add(g1,g2);
  const crown=new T.Mesh(new T.CylinderGeometry(.12,.12,.3,16),M.gold); crown.position.y=1.78; w.add(crown);
  const man=A.human(L2.skin(T,C,.15)); man.scale.setScalar(.6); man.position.set(-2.8,0,.6); man.rotation.y=.8; sc.add(man);
  const tool=new T.Mesh(new T.CylinderGeometry(.04,.04,.7,8),M.gold); sc.add(tool);
  const sp=L2.pts(A,40,.07,C.gold);
  A.on(t=>{g1.rotation.z=t*.8; g2.rotation.z=-t*.8*12/9; mh.rotation.z=-t*.5; hh.rotation.z=-t*.04; w.rotation.y=Math.sin(t*.5)*.35;
    const s=Math.sin(t*4); tool.position.set(-2+.15*s,1.5+.15*Math.abs(s),.9); tool.rotation.z=.8+.4*s;
    for(let k=0;k<40;k++){const u=L2.ph(t*1.5+k/40,1),a=k*2.4; sp.a[k*3]=-1.7+Math.cos(a)*u*.6; sp.a[k*3+1]=1.6+Math.sin(a)*u*.6; sp.a[k*3+2]=.9;} sp.up();});
  return A.go();};

/* نظم و نسق جهان: an orrery, every planet on its exact path */
S.cosmos=el=>{const A=stage(el,{cam:[0,4.5,10],look:[0,1.8,0],sway:.3}),{T,sc,M,C}=A;
  const sys=new T.Group(); sys.position.y=1.8; sys.rotation.x=.35; sc.add(sys);
  sys.add(A.orb(.6,C.gold,2.4));
  const cols=[C.ember,C.sea,C.gold,new T.Color("#c86a4a"),C.ember,C.sea];
  const pl=[1.3,1.95,2.6,3.25,3.9,4.5].map((r,k)=>{const o=new T.Mesh(new T.TorusGeometry(r,.012,6,160),M.glow(C.gold,.45)); o.rotation.x=Math.PI/2; sys.add(o);
    const p=new T.Mesh(new T.SphereGeometry(.12+k%3*.06,24,16),new T.MeshStandardMaterial({color:cols[k],emissive:cols[k],emissiveIntensity:.3,roughness:.5})); sys.add(p); return {p,r,w:1.4/Math.pow(r,1.5),ph:k*1.3};});
  const moon=new T.Mesh(new T.SphereGeometry(.05,12,8),M.ink); pl[2].p.add(moon);
  const rg=new T.Mesh(new T.TorusGeometry(.32,.025,6,48),M.gold); rg.rotation.x=1.2; pl[4].p.add(rg);
  A.on(t=>{pl.forEach(o=>{const a=o.ph+t*o.w; o.p.position.set(Math.cos(a)*o.r,0,Math.sin(a)*o.r); o.p.rotation.y=t;}); moon.position.set(Math.cos(t*3)*.35,0,Math.sin(t*3)*.35); sys.scale.setScalar(.001+A.ease(t,0,1.4));});
  return A.go();};

return S;
})();


function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)&&v.length?v:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(slides))}catch(e){}}
let slides=load()||structuredClone(DEFAULT), i=0, j=0, editing=false, timer=null;
const $=id=>document.getElementById(id), text=$("text"), scene=$("scene");
const NEXT_KEYS=["ArrowRight","ArrowDown","PageDown"," ","Enter"], PREV_KEYS=["ArrowLeft","ArrowUp","PageUp","Backspace"];
const fa=n=>String(n);

function renderText(){
  const segs=slides[i].segs; let html="",open=null;
  segs.forEach((s,n)=>{
    if(!open||open!==s.k||s.np){ if(open) html+=`</div>`; html+=`<div class="blk ${s.k}"${s.k==="ar"?' lang="ar" dir="rtl"':""}>`; open=s.k; }
    else html+=" ";
    html+=`<span class="seg" data-n="${n}" tabindex="0">${esc(s.t)}</span>`;
  });
  if(open) html+="</div>";
  text.innerHTML=html; text.classList.toggle("edit",editing);
  text.querySelectorAll(".seg").forEach(el=>el.contentEditable=editing?"true":"false");
  $("noteBox").textContent=slides[i].note||""; $("noteBox").contentEditable=editing?"true":"false";
  $("notes").classList.toggle("edit",editing);
  $("dots").innerHTML=slides.map((x,n)=>`<button class="dot" aria-label="Slide ${fa(n+1)}" ${n===i?'aria-current="true"':''} data-n="${n}"></button>`).join("");
}
function renderSeg(){ ambRipple(); const _dt=document.getElementById("detail"); if(_dt) _dt.hidden=true;
  const segs=slides[i].segs; j=Math.max(0,Math.min(j,segs.length-1));
  text.querySelectorAll(".seg").forEach(el=>el.classList.toggle("on",+el.dataset.n===j));
  const s=segs[j]||{}, key=(s.s in SC||s.s in G3D)?s.s:"plain";
  if(G3D[key] && window.THREE && webglOK()){
    if(cur3D!==key){ stop3D(); scene.innerHTML=`<div class="g3d fade" role="img" aria-label="${esc(NAMES[key])}"></div>`; start3D(key, scene.firstChild); }
  } else { stop3D(); scene.innerHTML=svgFor(key); }
  $("count").textContent=`${fa(i+1)} / ${fa(slides.length)}`;
  $("scenePick").value=key;
  const on=text.querySelector(".seg.on"); if(on&&!editing) on.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function go(si,sj){ if(si<0||si>=slides.length) return; const changed=si!==i; i=si; j=sj; if(changed) renderText(); renderSeg(); }
function next(){ if(j<slides[i].segs.length-1) go(i,j+1); else if(i<slides.length-1) go(i+1,0); else if(L<LESSONS.length-1) setLesson(L+1); else stopPlay(); }
function prev(){ if(j>0) go(i,j-1); else if(i>0) go(i-1,slides[i-1].segs.length-1); else if(L>0) setLesson(L-1,true); }
function setLesson(n,atEnd){ n=Math.max(0,Math.min(LESSONS.length-1,n)); $("detail").hidden=true;
  L=n; KEY=LESSONS[n].key; DEFAULT=LESSONS[n].slides; slides=load()||structuredClone(DEFAULT);
  i=atEnd?slides.length-1:0; j=atEnd?slides[i].segs.length-1:0;
  document.querySelectorAll(".lsn").forEach((b,k)=>b.setAttribute("aria-current",k===n?"page":"false"));
  $("lessonTitle").textContent=LESSONS[n].title;
  try{ if(location.hash!=="#lesson-"+(n+1)) history.replaceState(null,"","#lesson-"+(n+1)); }catch(e){}
  renderText(); renderSeg(); }
document.querySelectorAll(".lsn").forEach(b=>b.onclick=()=>{ stopPlay(); if(+b.dataset.l!==L) setLesson(+b.dataset.l); });
const hashLesson=()=>{const m=/^#lesson-(\d+)$/.exec(location.hash||""); return m?Math.min(LESSONS.length,Math.max(1,+m[1]))-1:0;};
addEventListener("hashchange",()=>{const n=hashLesson(); if(n!==L) setLesson(n);});

$("scenePick").innerHTML=Object.entries(NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
$("next").onclick=()=>{stopPlay();next()}; $("prev").onclick=()=>{stopPlay();prev()};
$("dots").onclick=e=>{const b=e.target.closest(".dot"); if(b){stopPlay();go(+b.dataset.n,0)}};
text.addEventListener("click",e=>{ if(!editing) return; const s=e.target.closest(".seg"); if(s){ j=+s.dataset.n; renderSeg(); }});
/* PowerPoint-style: a click anywhere on the slide moves to the next step */
$("stage").addEventListener("click",e=>{ if(editing||!$("detail").hidden) return; if(e.target.closest("[data-ev],a,button,select,input,.detail")) return; if(getSelection&&String(getSelection())) return; stopPlay(); next(); });
text.addEventListener("focusin",e=>{const s=e.target.closest(".seg"); if(s&&editing&&+s.dataset.n!==j){ j=+s.dataset.n; renderSeg(); }});
document.addEventListener("keydown",e=>{
  if(!$("detail").hidden){ if(e.key==="Escape"){e.preventDefault();closeEv();} return; }
  const evEl=e.target.closest&&e.target.closest("[data-ev]");
  if(evEl&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openEv(evEl.dataset.ev);return;}
  if(e.target.isContentEditable||/SELECT|INPUT/.test(e.target.tagName)) return;
  if(/^(BUTTON|A)$/.test(e.target.tagName)&&(e.key===" "||e.key==="Enter")) return;
  if(NEXT_KEYS.includes(e.key)){e.preventDefault();stopPlay();next();}
  else if(PREV_KEYS.includes(e.key)){e.preventDefault();stopPlay();prev();}
  else if(e.key==="Home"){e.preventDefault();stopPlay();go(0,0);}
  else if(e.key==="End"){e.preventDefault();stopPlay();go(slides.length-1,slides[slides.length-1].segs.length-1);}
  else if(e.key==="f"||e.key==="F"){e.preventDefault();fullscreen();}
});
let lastEv=null;
function openEv(id){const e=EV[id]; if(!e) return; stopPlay(); lastEv=id;
  $("dKind").textContent=KIND[e.k]||""; $("dKind").dataset.k=e.k; $("dYear").textContent=e.y; $("dTitle").textContent=e.t;
  $("dBody").innerHTML=e.b.map(p=>`<p>${esc(p)}</p>`).join("");
  $("dVid").href="https://www.youtube.com/results?search_query="+encodeURIComponent(e.v);
  $("detail").hidden=false; $("detail").scrollTop=0; $("backBtn").focus();}
function closeEv(){ if($("detail").hidden) return; $("detail").hidden=true; const el=scene.querySelector(`[data-ev="${lastEv}"]`); if(el) el.focus(); }
scene.addEventListener("click",e=>{const g=e.target.closest("[data-ev]"); if(g) openEv(g.dataset.ev);});
$("backBtn").onclick=closeEv;
let tx=null; $("stage").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("stage").addEventListener("touchend",e=>{if(tx==null||editing)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){stopPlay();dx<0?next():prev();}tx=null;});

text.addEventListener("input",e=>{const s=e.target.closest(".seg"); if(!s||!editing) return; slides[i].segs[+s.dataset.n].t=s.innerText.replace(/\n+/g," ").trim(); save();});
$("noteBox").addEventListener("input",e=>{ if(!editing) return; slides[i].note=e.target.innerText.trim(); save(); });

function stopPlay(){ if(timer){clearInterval(timer);timer=null;} $("playBtn").setAttribute("aria-pressed","false"); $("playBtn").textContent="▶ Autoplay"; }
$("playBtn").onclick=function(){ if(timer){stopPlay();return;} this.setAttribute("aria-pressed","true"); this.textContent="❚❚ Pause"; timer=setInterval(next,7000); };
$("notesBtn").onclick=function(){const on=this.getAttribute("aria-pressed")!=="true";this.setAttribute("aria-pressed",on);$("notes").hidden=!on;};
$("editBtn").onclick=function(){ stopPlay(); editing=!editing; this.setAttribute("aria-pressed",editing); this.textContent=editing?"Done editing":"Edit"; $("editbar").hidden=!editing; renderText(); renderSeg(); };
function fullscreen(){ try{ const p=document.fullscreenElement?document.exitFullscreen():$("stage").requestFullscreen(); p&&p.catch&&p.catch(()=>{}); }catch(e){} }
$("fsBtn").onclick=fullscreen;
$("scenePick").onchange=e=>{ slides[i].segs[j].s=e.target.value; save(); renderSeg(); };
$("addSeg").onclick=()=>{ const cur=slides[i].segs[j]; slides[i].segs.splice(j+1,0,{k:cur?cur.k:"p",t:"…",s:"plain",np:false}); save(); j++; renderText(); renderSeg(); };
$("addBtn").onclick=()=>{ slides.splice(i+1,0,{segs:[{k:"p",t:"…",s:"plain",np:false}],note:""}); save(); go(i+1,0); };
function armed(btn,label,fn){let on=false,t,old=btn.textContent;btn.onclick=()=>{if(!on){on=true;btn.textContent=label;t=setTimeout(()=>{on=false;btn.textContent=old},3000);return;}clearTimeout(t);on=false;btn.textContent=old;fn();};}
armed($("delSeg"),"Click again to delete",()=>{ if(slides[i].segs.length<=1) return; slides[i].segs.splice(j,1); save(); j=Math.max(0,j-1); renderText(); renderSeg(); });
armed($("delBtn"),"Click again to delete",()=>{ if(slides.length<=1) return; slides.splice(i,1); save(); i=Math.min(i,slides.length-1); j=0; renderText(); renderSeg(); });
armed($("resetBtn"),"Click again to erase all changes",()=>{ slides=structuredClone(DEFAULT); save(); i=0; j=0; renderText(); renderSeg(); });
if(hashLesson()) setLesson(hashLesson()); else { renderText(); renderSeg(); }
</script>
