<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Vazirmatn:wght@400;600&family=EB+Garamond:wght@400;600&display=swap">
<style>
:root{--night:#0C0A1C;--leaf:#14112B;--ink:#F4ECDD;--muted:#A59CC4;--line:#2E2852;--gold:#F4B740;--ember:#FF8B3D;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--night);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;
  background-image:radial-gradient(70% 55% at 50% 30%,rgba(255,139,61,.12),transparent 70%);
  display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:820px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
svg{width:120px;height:120px}
.spin{transform-origin:60px 60px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
h1{margin:0;font-family:"Reem Kufi",sans-serif;font-weight:700;font-size:clamp(34px,6vw,54px);line-height:1.3;color:var(--gold);text-shadow:0 0 24px rgba(244,183,64,.35)}
.en{font-family:"EB Garamond",Georgia,serif;font-size:clamp(20px,3vw,26px);color:var(--muted);margin-top:-14px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%}
a.card{display:flex;flex-direction:column;gap:6px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--leaf);color:var(--ink);text-decoration:none;transition:border-color .2s,box-shadow .2s}
a.card:hover,a.card:focus-visible{border-color:var(--gold);box-shadow:0 0 30px -8px rgba(244,183,64,.45);outline:none}
a.card b{font-family:"Reem Kufi",sans-serif;font-size:26px;color:var(--gold);font-weight:500}
a.card span{color:var(--muted);font-size:15px}
a.card[lang=en] b,a.card[lang=en] span{font-family:"EB Garamond",Georgia,serif}
a.card[lang=en] span{font-size:17px}
p.tip{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 120" aria-hidden="true"><g class="spin" fill="none" stroke="#F4B740" stroke-width="2.2"><rect x="28" y="28" width="64" height="64"/><rect x="28" y="28" width="64" height="64" transform="rotate(45 60 60)"/></g><circle cx="60" cy="60" r="20" fill="none" stroke="#FF8B3D" stroke-width="2.2"/><circle cx="60" cy="60" r="5" fill="#F4B740"/></svg>
  <h1>برتریت انسان</h1>
  <div class="en" lang="en" dir="ltr">The Superiority of Man</div>

    <a class="card" href="en.html" lang="en" dir="ltr"><b>English</b><span>Lesson One: General Questions</span></a>
  </div>
  <p class="tip">برای پیش رفتن کلیک کنید یا کلیدهای جهت را بزنید؛ برای تمام‌صفحه کلید <b dir="ltr">F</b></p>
</main>
</body>
